# =============================================================================
# WORDPRESS GENERIC - Upsun Configuration V4 BEDROCK (Unified Format)
# =============================================================================
# Optimized configuration for Roots Bedrock on Upsun
# Structure: web/app/ (wp-content) + web/wp/ (WordPress core)
# =============================================================================
#
# MODE: DEVELOPMENT (ressources minimales)
# Pour passer en PRODUCTION:
#   1. Ajuster les resources (CPU/RAM) avec `upsun resources:set`
#   2. Set WP_ENV to 'production'
#   3. Activer Redis via `upsun variable:update ENABLE_REDIS --value true`
#
# =============================================================================

# =============================================================================
# APPLICATIONS
# =============================================================================
applications:
  app:
    type: "php:8.3"
    # Container profile: HIGH_CPU (moins de RAM), BALANCED, HIGH_MEMORY
    # DEV: HIGH_CPU = 0.1 CPU -> 64MB RAM (minimum)
    container_profile: HIGH_CPU

    # =========================================================================
    # PHP RUNTIME CONFIGURATION
    # =========================================================================
    runtime:
      extensions:
        - redis
        - imagick
        - intl
        - zip
        - sodium
        - opcache
        # - apcu  # PROD: Uncomment for APCu cache

      sizing_hints:
        request_memory: 32
        reserved_memory: 64

    # =========================================================================
    # COMPOSER DEPENDENCIES
    # =========================================================================
    dependencies:
      php:
        wp-cli/wp-cli-bundle: "^2.11"
        composer/composer: "^2"

    # =========================================================================
    # SERVICE RELATIONSHIPS
    # =========================================================================
    relationships:
      database: "mysqldb:mysql"
      redis: "rediscache:redis"

    # =========================================================================
    # WEB SERVER CONFIGURATION - BEDROCK
    # =========================================================================
    # Note: CPU/RAM se configure via CLI: upsun resources:set --size app:0.1
    web:
      locations:
        "/health":
          root: "web/app/mu-plugins"
          passthru: "/health-check.php"
          allow: true
          scripts: true
          headers:
            Access-Control-Allow-Origin: "*"

        "/.well-known":
          root: "web/.well-known"
          scripts: false
          allow: true
          headers:
            Content-Type: "text/plain; charset=utf-8"

        "/":
          root: "web"
          passthru: "/index.php"
          index: ["index.php"]
          expires: 1h
          scripts: true
          allow: true

          headers:
            X-Frame-Options: "SAMEORIGIN"
            X-Content-Type-Options: "nosniff"
            # Note: X-XSS-Protection intentionally omitted (deprecated, can introduce vulnerabilities)
            Referrer-Policy: "strict-origin-when-cross-origin"
            Permissions-Policy: "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()"

          rules:
            # === SECURITY RULES ===
            # Block sensitive files
            '\.(env|git|composer\.json|composer\.lock|auth\.json)$':
              allow: false

            # Block config, backup & documentation files (Defense in Depth)
            # Note: JSON is allowed for WP Block Editor translations
            '\.(yml|yaml|dist|sql|log|sh|bak|ini|swp|md|markdown)$':
              allow: false

            # Block multiple slashes (path traversal attempts)
            "^//+":
              allow: false

            # Block PHP in uploads (Enhanced)
            '^/app/uploads/.*\.(php[0-9]?|phtml|inc)$':
              allow: false

            # Block direct PHP access in plugins/themes (Prevent bypass)
            '^/app/(plugins|themes)/.*\.php$':
              allow: false

            # === STATIC ASSETS ===
            '\.(css|js|gif|jpe?g|png|webp|avif|ttf|eot|svg|woff2?|ico|pdf)$':
              allow: true
              expires: 1y
              scripts: false
              headers:
                Cache-Control: "public, max-age=31536000, immutable"
                Vary: "Accept-Encoding"
                Access-Control-Allow-Origin: "*"

            # === VERSION DISCLOSURE PROTECTION ===
            # Block files that reveal WordPress version (readme.html, license.txt, etc.)
            # Note: No $ anchor to match with or without trailing slash
            '^(?:/wp)?/(?:readme|license|changelog|-config|-sample)\.(?:html|txt|php)':
              allow: false

            # === WORDPRESS ADMIN PROTECTION ===

            # Block ALL wp-login.php access (use secret path instead)
            '^/wp/wp-login\.php':
              allow: false
            '^/wp-login\.php':
              allow: false

            # Block fake wp-admin at root (doesn't exist in Bedrock, returns empty page)
            '^/wp-admin':
              allow: false

            # Block install/upgrade scripts (not needed after deployment)
            '^/wp/wp-admin/(install|upgrade)\.php':
              allow: false

            # Block XML-RPC completely
            '^/wp/xmlrpc\.php':
              allow: false

            '^/xmlrpc\.php':
              allow: false

            # Block User Enumeration (REST API)
            "^/wp-json/wp/v2/users":
              allow: false

        "/app/uploads":
          root: "web/app/uploads"
          expires: 1M
          scripts: false
          allow: true
          headers:
            Cache-Control: "public, max-age=2592000"

        "/app":
          root: "web/app"
          scripts: false
          allow: false
          rules:
            '\.(css|js|gif|jpe?g|png|webp|avif|svg|woff2?|ico)$':
              allow: true

    # =========================================================================
    # MOUNTS - BEDROCK STRUCTURE
    # =========================================================================
    mounts:
      "/web/app/uploads":
        source: storage
        source_path: "uploads"
      "/web/app/cache":
        source: local
        source_path: "cache"
      "/.wp-cli":
        source: local
        source_path: "wp-cli"

    # =========================================================================
    # CRON JOBS
    # =========================================================================
    crons:
      wordpress:
        spec: "*/5 * * * *"
        commands:
          start: "wp cron event run --due-now --quiet"

    # =========================================================================
    # DEPLOYMENT HOOKS
    # =========================================================================
    hooks:
      # BUILD HOOK - Composer dependencies + Redis setup
      build: |
        set -e

        echo "🔨 [BUILD] Starting Bedrock build phase..."

        # 1. Install Composer dependencies
        if [ -f composer.json ]; then
            echo "📦 [1/3] Installing Composer dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
            echo "✅ Composer dependencies installed"

            # 2. Supply Chain Security: Audit dependencies for known vulnerabilities (CVE)
            echo "🛡️ [2/3] Auditing dependencies for vulnerabilities..."
            composer audit --locked || echo "⚠️  Vulnerabilities found! Review the report above."
        fi

        # 3. Redis Object Cache Setup
        # Only configure if ENABLE_REDIS is true
        if [ "${ENABLE_REDIS:-false}" = "true" ]; then
            echo "🔧 [3/3] Setting up Redis object cache (ENABLED)..."
            if [ -f web/app/plugins/redis-cache/includes/object-cache.php ]; then
                cp web/app/plugins/redis-cache/includes/object-cache.php web/app/object-cache.php
                echo "✅ Redis object-cache.php copied (redis-cache plugin)"
            elif [ -f web/app/plugins/wp-redis/object-cache.php ]; then
                cp web/app/plugins/wp-redis/object-cache.php web/app/object-cache.php
                echo "✅ Redis object-cache.php copied (wp-redis plugin)"
            else
                echo "⚠️  No Redis plugin found but ENABLE_REDIS=true"
            fi
        else
            echo "ℹ️  Redis setup skipped (ENABLE_REDIS != true)"
            # Cleanup if previously enabled but now disabled
            if [ -f web/app/object-cache.php ]; then
                rm web/app/object-cache.php
                echo "🗑️  Removed existing object-cache.php"
            fi
        fi

        echo "✅ Build phase completed"

      # DEPLOY HOOK - WordPress setup & generic plugins activation
      # Note: No .env file needed - wp-config.php reads directly from PLATFORM_RELATIONSHIPS
      deploy: |
        set -e

        echo "🚀 [DEPLOY] Starting Bedrock deployment..."

        # Suppress WP-CLI config warnings for Bedrock structure
        export WP_CLI_SUPPRESS_GLOBAL_PARAMS=1

        # Get site URL for WP-CLI commands
        export SITE_URL=$(echo $PLATFORM_ROUTES | base64 --decode | jq -r 'to_entries[] | select(.value.primary) | .key' | sed 's/\/$//')

        # STEP 1: WordPress Core Install (WP-CLI uses wp-cli.yml for path)
        if ! wp core is-installed --quiet 2>/dev/null; then
            echo "📦 [1/3] Installing WordPress Core (${WP_LOCALE:-en_US})..."

            wp core install \
                --url="$SITE_URL" \
                --title="My WordPress Site" \
                --admin_user="$WP_ADMIN_USER" \
                --admin_password="$WP_ADMIN_PASSWORD" \
                --admin_email="$WP_ADMIN_EMAIL" \
                --locale="${WP_LOCALE:-en_US}" \
                --skip-email

            echo "✅ WordPress installed"
        else
            echo "✅ WordPress already installed"
        fi

        # Always update URLs (critical for Upsun environment changes)
        echo "🔧 [2/3] Updating site URLs..."
        wp option update home "$SITE_URL" --quiet || true
        wp option update siteurl "$SITE_URL/wp" --quiet || true

        # Database migrations
        echo "🔄 [3/3] Checking database..."
        wp core update-db --quiet || true

        # Update Translations
        echo "🌍 Updating translations..."
        wp language core update --quiet || true
        wp language plugin update --all --quiet || true
        wp language theme update --all --quiet || true

        echo "✅ Deploy phase completed"

      # POST-DEPLOY HOOK - Final checks & caching
      post_deploy: |
        set -e

        echo "🔄 [POST-DEPLOY] Starting post-deployment tasks..."

        # Integrity Check (Security) - WP-CLI uses wp-cli.yml for path
        echo "🔍 Checking WordPress Core integrity..."
        if wp core verify-checksums --quiet; then
            echo "✅ Core integrity verified"
        else
            echo "⚠️  WARNING: Core checksums verification failed!"
        fi

        # Flush rewrite rules (idempotent)
        wp rewrite flush --quiet || true

        # Flush object cache (idempotent)
        wp cache flush --quiet || true

        # Enable Redis cache (if enabled in env and plugin exists)
        if [ "${ENABLE_REDIS:-false}" = "true" ]; then
            if wp plugin is-installed redis-cache 2>/dev/null; then
                wp redis enable --quiet || true
                echo "✅ Redis cache enabled"
            fi
        else
            echo "ℹ️  Redis cache disabled via ENV"
            if wp plugin is-installed redis-cache 2>/dev/null; then
                 # Optional: force disable if running but shouldn't be
                 # wp redis disable --quiet || true
                 echo "ℹ️  (Use 'upsun variable:update ENABLE_REDIS --value true' to enable)"
            fi
        fi

        echo "✅ Post-deploy phase completed"
        echo "🎉 Deployment successful!"
        echo ""
        echo "💡 DEV MODE: To reduce resources to minimum, run:"
        echo "   upsun resources:set --size app:0.1 --size mysqldb:0.1 --yes"

    # =========================================================================
    # ENVIRONMENT VARIABLES
    # =========================================================================
    variables:
      env:
        # WordPress Environment (PROD: change to 'production')
        WP_ENV: "development"

        # WordPress locale (default: en_US)
        # Set via: upsun variable:create --name WP_LOCALE --value "fr_FR"
        WP_LOCALE: "en_US"

        # Secret admin path - MUST be set via environment variable for security
        # DO NOT commit a real value here - set via: upsun variable:create --name WP_ADMIN_SECRET_PATH --value "your-random-secret" --sensitive true
        # If empty/unset, secret path protection is disabled and wp-login.php is accessible
        WP_ADMIN_SECRET_PATH: ""

        # Security: CSP Mode - Managed automatically by wp-config.php
        # WP_ENV=development -> report-only
        # WP_ENV=production  -> strict
        # (Uncomment to override manually)
        # UPSUN_CSP_MODE: "report-only"

        # Redis Activation (Control usage, not provisioning)
        ENABLE_REDIS: "false"

      php:
        # Memory - DEV (reduce to save resources)
        memory_limit: 128M
        max_execution_time: 120
        max_input_time: 120
        post_max_size: 32M
        upload_max_filesize: 32M

        # OPcache - Performance (Immutable code on Upsun -> validate_timestamps=0 recommended)
        opcache.enable: 1
        opcache.memory_consumption: 128
        opcache.interned_strings_buffer: 16
        opcache.max_accelerated_files: 20000
        opcache.validate_timestamps: 0
        opcache.revalidate_freq: 0

        # Session
        session.gc_probability: 1
        session.gc_divisor: 100
        session.gc_maxlifetime: 3600

# =============================================================================
# SERVICES CONFIGURATION
# =============================================================================
services:
  mysqldb:
    type: "mariadb:10.11"
    # MariaDB requires min 448MB -> HIGH_MEMORY at 0.1 CPU = 448MB
    container_profile: HIGH_MEMORY
    configuration:
      schemas:
        - main
      endpoints:
        mysql:
          default_schema: main
          privileges:
            main: admin

  rediscache:
    type: "redis:7.0"

# =============================================================================
# ROUTES CONFIGURATION
# =============================================================================
# Configure caching, redirects, and access control at the routing level
# =============================================================================
routes:
  # Main route with caching
  "https://{default}/":
    type: upstream
    upstream: "app:http"
    cache:
      enabled: true
      default_ttl: 300
      # Don't cache for logged-in users
      cookies: ["/^wordpress_/", "/^wp-/", "PHPSESSID", "/^comment_author_/"]
      headers: ["Accept", "Accept-Language"]

  # REST API (partial cache for public endpoints)
  "https://{default}/wp-json":
    type: upstream
    upstream: "app:http"
    cache:
      enabled: true
      default_ttl: 60
      cookies: ["/^wordpress_/", "/^wp-/"]

  # HTTP to HTTPS redirect
  "http://{default}/":
    type: redirect
    to: "https://{default}/"
# =============================================================================
# SETUP INSTRUCTIONS
# =============================================================================
#
# REQUIRED ENVIRONMENT VARIABLES:
# --------------------------------
# Set these via Upsun CLI before first deployment:
#
# upsun variable:create --level environment --name WP_ADMIN_USER --value "admin" --sensitive true
# upsun variable:create --level environment --name WP_ADMIN_PASSWORD --value "VOTRE_MOT_DE_PASSE_SECURISE" --sensitive true
# upsun variable:create --level environment --name WP_ADMIN_EMAIL --value "admin@example.com" --sensitive true
#
# IMPORTANT - SECRET ADMIN PATH:
# ------------------------------
# Set your secret login path via environment variable (never commit secrets!):
# upsun variable:create --name WP_ADMIN_SECRET_PATH --value "your-random-secret-2024" --sensitive true
#
# Once set, access wp-admin via: https://yoursite.com/your-random-secret-2024
# Direct access to /wp/wp-login.php will return 404
#
# REDIS CONFIGURATION:
# --------------------
# To enable Redis object caching:
# upsun variable:create --level environment --name ENABLE_REDIS --value "true"
#
